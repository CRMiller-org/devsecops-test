name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-and-build:
    name: Security Scan & Build
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Test Dockerfile & Build Image
        run: |
          cat << 'EOF' > Dockerfile
          FROM alpine:latest
          RUN echo "DevSecOps container test built on OMEN" > /test.txt
          CMD ["cat", "/test.txt"]
          EOF

          docker build -t devsecops-test:${{ github.sha }} .

      - name: Container Image Vulnerability Scan
        run: |
          docker run --rm \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            devsecops-test:${{ github
