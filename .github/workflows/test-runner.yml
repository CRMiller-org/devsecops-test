name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-and-build:
    name: Security Scan & Build
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Create Test Dockerfile & Build Image
        run: |
          cat << 'EOF' > Dockerfile
          FROM alpine:latest
          RUN echo "DevSecOps container test built on OMEN" > /test.txt
          CMD ["cat", "/test.txt"]
          EOF

          docker build -t devsecops-test:${{ github.sha }} .

      - name: Container Image Vulnerability Scan
        run: |
          docker run --rm \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            devsecops-test:${{ github.sha }}

      - name: Generate Container SBOM (SPDX Format)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD":/workspace \
            -w /workspace \
            aquasec/trivy:latest image \
            --format spdx-json \
            --output sbom.spdx.json \
            devsecops-test:${{ github.sha }}

      - name: Display & Archive SBOM
        run: cat sbom.spdx.json

      - name: Archive SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx-${{ github.sha }}
          path: sbom.spdx.json
