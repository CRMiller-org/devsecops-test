name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-and-build:
    name: Security Scan & Build
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Repository Misconfiguration Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: false
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      - name: Build Test Docker Image (In-Memory with Caching)
        run: |
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t devsecops-test:${{ github.sha }} - <<'EOF'
          FROM alpine:latest
          RUN echo "DevSecOps inline container test built on OMEN" > /test.txt
          CMD ["cat", "/test.txt"]
          EOF

      - name: Container Image Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-test:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Generate & Output Container SBOM (SPDX Format)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy image --format spdx-json \
            --output sbom.spdx.json devsecops-test:${{ github.sha }}
          cat sbom.spdx.json
